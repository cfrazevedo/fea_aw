version: 2

models:
  - name: fact_sales
    description: "A fact table containing sales transactions including details such as product, special offer, customer, and salesperson."
    columns:
      - name: sales_sk
        description: "Surrogate key for sales transaction."
        tests:
          - unique
          - not_null

      - name: sales_order_detail_id
        description: "Unique identifier for the order detail in the source data."
        tests:
          - not_null
          - unique
          
      - name: sales_order_id
        description: "Foreign key referring to dim_sales_cost."
        tests:
          - not_null

      - name: product_fk
        description: "Foreign key referring to dim_products."
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_sk

      - name: customer_fk
        description: "Foreign key referring to dim_customers."
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_sk


      - name: sales_hierarchy_fk
        description: "Foreign key referring to the dim_sales_hierarchy."
        tests:
          - not_null
          - relationships:
              to: ref('dim_sales_hierarchy')
              field: sales_hierarchy_sk

      - name: sales_person_id
        description: "Identifier for the salesperson."

      - name: territory_id
        description: "Identifier for the sales territory."
        tests:
          - not_null

      - name: city_name
        description: "Order city name."
        tests:
          - not_null

      - name: state_province_name
        description: "Order state or province name."
        tests:
          - not_null
      
      - name: order_quantity
        description: "Quantity of items ordered."
        tests:
          - not_null

      - name: unit_price
        description: "Price per unit."
        tests:
          - not_null

      - name: unit_price_discount_percentage
        description: "Discount percentage applied to the unit price."

      - name: unit_price_discount_value
        description: "Discount value applied to sub total."

      - name: line_total
        description: "Total of products value in line (sub total)."
        tests:
          - not_null

      - name: tax_amount_portion
        description: "Tax amount line proportion."
        tests:
          - not_null

      - name: freight_portion
        description: "Shipping cost line proportion."
        tests:
          - not_null

      - name: subtotal_portion
        description: "SubTotal line proportion."
        tests:
          - not_null

      - name: standard_cost
        description: "Standard cost per unit."
        tests:
          - not_null
        
      - name: profit
        description: "Profit line."
        tests:
          - not_null
          
      - name: card_type
        description: "Credit card name."
        tests:
          - not_null

      - name: order_date
        description: "Date when the order was placed."
        tests:
          - not_null

      - name: due_date
        description: "Date the order is due to the customer."
        tests:
          - not_null
          
      - name: ship_date
        description: "Date the order was shipped to the customer."
      
      - name: is_first_order
        description: "Identify if that order is the first order."
        tests:
          - not_null
      
      - name: customer_type
        description: "Identify if that customer is new (first order) or current (not first order)."
        tests:
          - not_null
      
      - name: status
        description: "Order current status. 1 = In process; 2 = Approved; 3 = Backordered; 4 = Rejected; 5 = Shipped; 6 = Cancelled"
        tests:
          - not_null

      - name: source_updated_at
        description: "Timestamp when the source of stg_sales_order_detail data was last updated."

      - name: updated_at
        description: "Timestamp when the record was last updated."
