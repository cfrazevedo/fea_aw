version: 2

models:
  - name: stg_aw__creditcard
    description: "Staging model for credit cards from database"
    
    columns:
      - name: credit_card_id
        description: "Primary key for CreditCard records."
        tests:
          - unique
          - not_null
          
      - name: card_type
        description: "Credit card name."
        tests:
          - not_null
          
      - name: card_number
        description: "Credit card number."
        tests:
          - unique
          - not_null
          
      - name: exp_month
        description: "Credit card expiration month."

          
      - name: exp_year
        description: "Credit card expiration year."

          
      - name: modified_date
        description: "Date and time the record was last updated."
        tests:
          - not_null

