version: 2

sources:
  - name: sources_aw
    database: fea_academy 
    schema: adventure_works

    tables:
      - name: person_address
        columns:
          - name: addressid
            tests:
              - unique
              - not_null
          
          - name: city
            tests:
              - not_null
          
          - name: stateprovinceid
            tests:
              - not_null
      
      - name: person_person
        columns:
          - name: businessentityid
            tests:
              - unique
              - not_null

          - name: firstname
            tests:
              - not_null

          - name: lastname
            tests:
              - not_null
      
      - name: person_stateprovince
        columns:
          - name: stateprovinceid
            tests:
              - unique
              - not_null

          - name: name
            tests:
              - not_null

      - name: production_product
        columns:
          - name: productid
            tests:
            - unique
            - not_null

      - name: production_productcategory
        columns:
          - name: productcategoryid
            tests:
            - unique
            - not_null

          - name: name
            tests:
            - not_null

      - name: production_productsubcategory
        columns:
          - name: productsubcategoryid
            tests:
            - unique
            - not_null

          - name: productcategoryid
            tests:
            - not_null

          - name: name
            tests:
            - not_null

      - name: production_productmodel
        columns:
          - name: productmodelid
      
      - name: sales_creditcard
        columns:
          - name: creditcardid
            tests:
              - unique
              - not_null

          - name: cardtype
            tests:
              - not_null

          - name: cardnumber
            tests:
              - unique
              - not_null

      - name: sales_customer
        columns:
          - name: customerid
            tests:
            - unique
            - not_null

      - name: sales_salesorderheader
        columns:
          - name: salesorderid
            tests:
            - unique
            - not_null
          - name: customerid
            tests:
            - not_null

      - name: sales_salesorderdetail
        columns:
          - name: salesorderid
            tests:
            - not_null

          - name: salesorderdetailid
            tests:
            - unique
            - not_null
            
          - name: productid
            tests:
            - not_null

      - name: sales_salesorderheadersalesreason
        columns:
          - name: salesorderid
            tests:
            - not_null
          
          - name: salesreasonid
            tests:
            - not_null

      - name: sales_salesperson
        columns:
          - name: businessentityid
            tests:
            - not_null

      - name: sales_salesreason
        columns:
          - name: salesreasonid
            tests:
            - unique
            - not_null

      - name: sales_salesterritory
        columns:
          - name: territoryid
            tests:
            - unique
            - not_null

      - name: sales_store
        columns:
          - name: businessentityid
            tests:
            - unique
            - not_null
            